# Structure pour Symfony (MVC)
root:
  src:
    Controller:
      DefaultController.php: "src/Controller/DefaultController.php.jinja"
  templates:
    base.html.twig: "templates/base.html.twig.jinja"
    index.html.twig: "templates/index.html.twig.jinja"
  public:
    index.php: "public/index.php.jinja"
  composer.json: "composer.json.jinja"
  README.md: "README.md.jinja"
  .gitignore: "gitignore.jinja"
