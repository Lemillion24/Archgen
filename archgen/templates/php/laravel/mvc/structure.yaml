# Structure pour Laravel (MVC)
root:
  app:
    Http:
      Controllers:
        Controller.php: "app/Http/Controllers/Controller.php.jinja"
  routes:
    web.php: "routes/web.php.jinja"
  public:
    index.php: "public/index.php.jinja"
  artisan: "artisan.jinja"
  composer.json: "composer.json.jinja"
  README.md: "README.md.jinja"
  .gitignore: "gitignore.jinja"
